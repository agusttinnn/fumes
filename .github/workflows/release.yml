# Builds fumes for Windows, macOS and Linux. Pushing a `v*` tag also
# publishes the builds as a GitHub Release; running it by hand only keeps
# them as workflow artifacts, to check that everything still builds.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc lets the binary run on more distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: fumes-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: fumes-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: fumes-macos-arm64
          # Cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: fumes-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # aws-lc-sys (rustls' crypto) assembles with NASM on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$dir/fumes.exe" .
            7z a "${{ matrix.name }}.zip" fumes.exe
          else
            tar -czf "${{ matrix.name }}.tar.gz" -C "$dir" fumes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fumes-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fumes $GITHUB_REF_NAME" \
            --generate-notes
