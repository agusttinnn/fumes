# Builds fumes for Windows, macOS and Linux. Every push to main replaces
# the builds in the `continuous` release (its tag moves to that commit);
# pushing a `v*` tag publishes them as a release of that version. Running
# it by hand only keeps them as workflow artifacts, to check that
# everything still builds.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to main makes a build of the one before it pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc lets the binary run on more distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: fumes-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: fumes-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: fumes-macos-arm64
          # Cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            name: fumes-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # aws-lc-sys (rustls' crypto) assembles with NASM on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$dir/fumes.exe" .
            7z a "${{ matrix.name }}.zip" fumes.exe
          else
            tar -czf "${{ matrix.name }}.tar.gz" -C "$dir" fumes
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  # Windows-only code (first-time setup, the engine's registry) can only
  # be compiled and tested there.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - run: cargo test --locked

  release:
    if: github.event_name == 'push'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish a version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fumes-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fumes $GITHUB_REF_NAME" \
            --generate-notes --latest=false
      # Published afresh every time, so the releases page dates it by this
      # build, and marked Latest, so /releases/latest is always the newest
      # build of main (a version doesn't take that over). Its links are
      # down for the few seconds between delete and create.
      - name: Replace the continuous build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short="${GITHUB_SHA::7}"
          notes="Built from $GITHUB_SHA, the latest commit on main. It's replaced on every push."
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true
          gh release create continuous fumes-* --target "$GITHUB_SHA" \
            --title "Latest build from main ($short)" --notes "$notes" --latest
